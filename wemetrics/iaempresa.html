<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IA DE ESTUDO DE EMPRESAS - GRUPO WE</title>
  <style>
    :root { --bg:#1f2937; --panel:#111827; --card:#0b1220; --muted:#9ca3af; --text:#e5e7eb; --accent:#0099FF; --accent-2:#0088e6; --danger:#ef4444; --warn:#f59e0b; --border:#374151; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, Noto Sans; }
    .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
    h1 { margin: 0 0 6px 0; font-size: 28px; font-weight: 800; }
    p.meta { color:var(--muted); margin:0 0 16px 0; }
    section { background: var(--panel); padding: 18px; border-radius: 14px; border: 1px solid var(--border); margin-top: 20px; }
    section h2 { margin: 0 0 12px 0; font-size: 18px; font-weight: 800; }
    label { font-size: 12px; color: var(--muted); display:block; margin-bottom: 6px; }
    input[type="text"] { width: 100%; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--border); background: #0c1424; color: var(--text); font-size: 14px; outline: none; }
    .btn { border: 0; padding: 10px 14px; border-radius: 12px; font-weight: 700; cursor: pointer; transition: background-color 0.2s; }
    .btn.primary { background: var(--accent); color: white; } .btn.primary:hover { background: var(--accent-2); }
    .btn:disabled { background: #334155; cursor: not-allowed; }
    .error-message { color: var(--danger); font-size: 14px; background: rgba(239, 68, 68, 0.1); border: 1px solid var(--danger); padding: 12px; border-radius: 8px; margin-bottom: 16px; }
    .warn { color: var(--warn); font-size:12px; }
    .logo-container { display: flex; justify-content: center; gap: 20px; }
    .loading-spinner {
        border: 4px solid var(--panel);
        border-top: 4px solid var(--accent);
        border-radius: 50%;
        width: 30px;
        height: 30px;
        animation: spin 1s linear infinite;
        margin: 20px auto;
    }
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
    .analysis-section {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 20px;
        margin-bottom: 20px;
    }
    .analysis-section h3 {
        color: var(--accent);
        font-size: 20px;
        font-weight: 800;
        margin-top: 0;
        margin-bottom: 12px;
        border-bottom: 1px solid var(--border);
        padding-bottom: 8px;
    }
    .analysis-section p, .analysis-section li {
        font-size: 14px;
        line-height: 1.6;
        color: var(--text);
    }
    .analysis-section ul {
        list-style: none;
        padding-left: 0;
    }
    .analysis-section li {
        position: relative;
        padding-left: 22px;
        margin-bottom: 10px;
    }
    .analysis-section li::before {
        content: "🔹";
        position: absolute;
        left: 0;
        color: var(--accent);
    }
    .analysis-section blockquote {
        margin: 0;
        padding: 10px 15px;
        border-left: 3px solid var(--accent);
        background-color: #1f2937;
        border-radius: 0 8px 8px 0;
        font-style: italic;
        color: var(--muted);
    }
    .persona-card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 15px;
        margin-bottom: 15px;
    }
    .persona-card h4 {
        margin: 0 0 8px 0;
        color: var(--accent);
        font-size: 16px;
        font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-container">
      <img src="https://i.imgur.com/wemetrics.png" alt="Logo Area51 e GrupoWe" style="width: 250px;">
    </div>
    <br>
    <h1>IA DE ESTUDO DE EMPRESAS</h1>
    <p class="meta">Desenvolvido por Eduardo Akkari e Renato Poletto.</p>

    <div id="exportRoot">
      <section id="initial">
        <h2>DADOS DO CLIENTE</h2>
        <div id="error-container" class="error-message" style="display: none;"></div>
        <div>
          <label>Nome da empresa</label>
          <input id="planName" type="text" placeholder="Ex: Agência WE" />
        </div>
		  <br>
        <div>
          <label>Site (incluir https://)</label>
          <input id="clientSite" type="text" placeholder="Ex: https://www.agenciawe.com.br" />
        </div>
		  <br>
        <button id="sendButton" class="btn primary">ENVIAR SOLICITAÇÃO PARA IA</button>
      </section>

      <section id="resultsSection" style="display: none;">
        <h2>ANÁLISE DA EMPRESA</h2>
        <div id="analysisContainer">
            </div>
      </section>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const sendButton = document.getElementById("sendButton");
      const analysisContainer = document.getElementById("analysisContainer");
      const resultsSection = document.getElementById("resultsSection");
      const errorContainer = document.getElementById("error-container");

      const displayError = (message) => {
        errorContainer.innerHTML = message;
        errorContainer.style.display = 'block';
      };

      sendButton.addEventListener("click", async () => {
        const planName = document.getElementById("planName").value;
        const clientSite = document.getElementById("clientSite").value;
        
        errorContainer.style.display = 'none';

        // Validação dos campos de entrada
        let errors = [];
        if (!planName.trim()) {
            errors.push("O nome da empresa é obrigatório.");
        }
        if (!clientSite.trim()) {
            errors.push("O site da empresa é obrigatório.");
        } else {
            try {
                // Valida se é um URL válido
                new URL(clientSite);
            } catch (_) {
                errors.push("Por favor, insira um URL válido para o site (ex: https://www.exemplo.com).");
            }
        }

        if (errors.length > 0) {
            displayError(errors.join('<br>'));
            return;
        }
        
        const formData = { planName, clientSite };

        resultsSection.style.display = "block";
        analysisContainer.innerHTML = `<div class="loading-spinner"></div>`;
        sendButton.textContent = "Analisando...";
        sendButton.disabled = true;
        
        // --- COLE SUA CHAVE DE API VÁLIDA AQUI ---
        // ATENÇÃO: Substitua o valor abaixo pela sua chave de API real.
        const geminiApiKey = "AIzaSyD1alAcjmbtlZ_NJyIu9ebRNEszcd8W-mo"; 
        
        // CORREÇÃO APLICADA AQUI:
        const geminiApiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${geminiApiKey}`;

        const analysisPrompt = `
          Sua tarefa é realizar uma análise de marketing detalhada da empresa "${formData.planName}" seguindo um processo rigoroso de duas etapas para garantir a máxima precisão.

          **Instrução Adicional Crucial:** Antes de iniciar a análise, você deve confirmar a natureza exata do negócio. Em alguns casos, a inteligência artificial pode confundir empresas. Por exemplo, a 'Amar Assist' é uma empresa de assistência funerária, não de assistência residencial. Certifique-se de que a sua análise reflita corretamente a área de atuação da empresa.

          **ETAPA 1: Análise Focada e Exclusiva do Site Oficial.**
          Nesta primeira etapa, você deve se concentrar *apenas e unicamente* no conteúdo encontrado no site: ${formData.clientSite}. Ignore qualquer conhecimento prévio que você tenha sobre a empresa. Extraia as seguintes informações diretamente do site:
          - **Briefing da Empresa**: Baseado na seção "Sobre Nós", "Quem Somos" ou na página inicial, descreva o que a empresa faz, sua missão e seu público-alvo, usando apenas as informações do site.
          - **Produtos**: Liste *todos* os produtos que são explicitamente mencionados e descritos no site. Se não houver produtos, retorne uma lista vazia.
          - **Serviços**: Liste *todos* os serviços que são explicitamente mencionados e descritos no site. Se não houver serviços, retorne uma lista vazia.
          - **Contatos**: Colete todas as informações de contato visíveis no site (telefones, emails, endereços, links de redes sociais).

          **ETAPA 2: Pesquisa Externa e Consolidação.**
          Agora, com base no entendimento adquirido na Etapa 1, realize uma pesquisa ampla na web sobre a empresa "${formData.planName}". Sua pesquisa deve consolidar informações de notícias, redes sociais e sites de avaliação, como Reclame Aqui e Google Meu Negócio.

          - **Pontos Fortes**: Com base na análise completa (site + pesquisa externa), identifique os principais diferenciais e pontos positivos da empresa.
          - **Pontos Fracos**: Identifique as principais críticas, desvantagens competitivas ou áreas para melhoria mencionadas externamente.
          - **Resumo da Reputação Online**: Resuma a percepção geral e o sentimento do público sobre a marca em toda a web. Mencione o teor das avaliações e a qualidade do atendimento ao cliente.
          - **10 Personas**: Com base em toda a análise, crie 10 personas detalhadas que seriam clientes ideais da empresa. Para cada persona, inclua: nome, uma breve descrição do perfil e a sugestão de qual produto ou serviço ela consumiria.

          **FINAL: Compilação do Resultado.**
          Compile todas as informações coletadas nas duas etapas em um único objeto JSON. **É crucial que as informações de 'briefing', 'produtos' e 'serviços' sejam baseadas estritamente nos dados da Etapa 1 (site oficial)** para garantir a precisão. As outras informações devem consolidar todo o aprendizado.

          Formate a sua resposta final estritamente como o objeto JSON solicitado, utilizando as seguintes chaves: pontos_fortes, pontos_fracos, produtos, serviços, contatos, briefing, resumo_reputacao_online, personas, e conclusao.
          `;
        
        const geminiPayload = {
          contents: [{ parts: [{ text: analysisPrompt }] }],
          generationConfig: {
            responseMimeType: "application/json",
            responseSchema: {
                "type": "OBJECT",
                "properties": {
                    "pontos_fortes": { "type": "ARRAY", "items": { "type": "STRING" } },
                    "pontos_fracos": { "type": "ARRAY", "items": { "type": "STRING" } },
                    "produtos": { "type": "ARRAY", "items": { "type": "STRING" } },
                    "serviços": { "type": "ARRAY", "items": { "type": "STRING" } },
                    "contatos": { "type": "ARRAY", "items": { "type": "STRING" } },
                    "briefing": { "type": "STRING" },
                    "resumo_reputacao_online": { "type": "STRING" },
                    "personas": {
                        "type": "ARRAY",
                        "items": {
                            "type": "OBJECT",
                            "properties": {
                                "nome": { "type": "STRING" },
                                "descricao": { "type": "STRING" },
                                "consumo_sugerido": { "type": "STRING" }
                            },
                            "required": ["nome", "descricao", "consumo_sugerido"]
                        }
                    },
                    "conclusao": { "type": "STRING" }
                },
                 "required": ["pontos_fortes", "pontos_fracos", "produtos", "serviços", "contatos", "briefing", "resumo_reputacao_online", "personas", "conclusao"]
            }
          }
        };

        // --- CÓDIGO REAL PARA CHAMADA DA API GEMINI ---
        let analysisData = {};
        
        try {
            if (!geminiApiKey || geminiApiKey.includes("SUA_CHAVE")) {
                throw new Error("Chave de API do Gemini não configurada. Por favor, edite o código HTML e insira sua chave de API válida.");
            }

            const response = await fetch(geminiApiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(geminiPayload)
            });

            if (!response.ok) {
                const errorBody = await response.text();
                console.error("Erro da API Gemini:", errorBody);
                throw new Error(`Falha na requisição da API Gemini. Status: ${response.status}. Verifique sua chave e as permissões.`);
            }

            const result = await response.json();
            
            // Tratamento de erro caso a resposta não contenha o que esperamos
            const textContent = result?.candidates?.[0]?.content?.parts?.[0]?.text;
            if (!textContent) {
                 console.error("Resposta da API Gemini inesperada:", JSON.stringify(result, null, 2));
                 throw new Error('A API Gemini não retornou uma resposta com conteúdo válido.');
            }

            analysisData = JSON.parse(textContent);
            
            if (Object.keys(analysisData).length === 0) {
                throw new Error('A API Gemini não retornou dados para a análise. Verifique se o site da empresa está acessível.');
            }

            renderContent(analysisData);

        } catch (error) {
            console.error('Erro:', error);
            analysisContainer.innerHTML = `<div class="analysis-section"><p class="error-message"><strong>Ocorreu um erro ao gerar a análise:</strong><br>${error.message}</p></div>`;
        } finally {
            sendButton.textContent = "ENVIAR SOLICITAÇÃO PARA IA";
            sendButton.disabled = false;
        }
      });

      function renderContent(data) {
        analysisContainer.innerHTML = '';
        
        const createSection = (title, content) => {
            if (!content || (Array.isArray(content) && content.length === 0)) {
                return '';
            }
            
            let contentHTML = '';
            if (Array.isArray(content)) {
                const listItems = content.map(item => `<li>${item}</li>`).join('');
                contentHTML = `<ul>${listItems}</ul>`;
            } else if (typeof content === 'string') {
                contentHTML = `<p>${content.replace(/\n/g, '<br>')}</p>`;
            }

            return `
                <div class="analysis-section">
                    <h3>${title}</h3>
                    ${contentHTML}
                </div>
            `;
        };
        
        const createPersonasSection = (title, personas) => {
            if (!personas || personas.length === 0) {
                return '';
            }
            
            const personasHTML = personas.map(p => `
                <div class="persona-card">
                    <h4>${p.nome}</h4>
                    <p><strong>Descrição:</strong> ${p.descricao}</p>
                    <p><strong>Consumiria:</strong> ${p.consumo_sugerido}</p>
                </div>
            `).join('');
            
            return `
                <div class="analysis-section">
                    <h3>${title}</h3>
                    ${personasHTML}
                </div>
            `;
        };

        const sections = [
            { title: 'Briefing da Empresa', content: data.briefing },
            { title: 'Serviços', content: data.serviços },
            { title: 'Produtos', content: data.produtos },
            { title: 'Pontos Fortes', content: data.pontos_fortes },
            { title: 'Pontos Fracos', content: data.pontos_fracos },
            { title: 'Contatos', content: data.contatos },
            { title: 'Resumo da Reputação Online', content: data.resumo_reputacao_online },
            { title: 'Personas Ideais', content: data.personas },
            { title: 'Conclusão', content: data.conclusao }
        ];

        let hasContent = false;
        sections.forEach(section => {
          if (section.title === 'Personas Ideais') {
            const sectionHTML = createPersonasSection(section.title, section.content);
            if (sectionHTML) hasContent = true;
            analysisContainer.innerHTML += sectionHTML;
          } else {
            const sectionHTML = createSection(section.title, section.content);
            if(sectionHTML) hasContent = true;
            analysisContainer.innerHTML += sectionHTML;
          }
        });

        if (!hasContent) {
            analysisContainer.innerHTML = `<div class="analysis-section"><p class="warn">Nenhuma informação foi retornada pela IA. Verifique se o site da empresa está correto e acessível, ou tente novamente.</p></div>`;
        }
      }
    });
  </script>
</body>
</html>
