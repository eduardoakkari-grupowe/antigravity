<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Grupo WE - Notícias Clientes</title>
    <script src="https://widget.rss.app/v1/magazine.js" type="text/javascript" async></script>
    <style>
        body {
            margin: 0;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, Noto Sans;
            background: #000; /* fundo preto */
            color: white; /* Define a cor do texto padrão para branco para melhor leitura no fundo preto */
        }
        header {
            background-color: #000;
            padding: 25px;
            text-align: center;
        }
        header img {
            width: 500px;
            height: auto;
            display: block;
            margin: 0 auto;
        }
        .container {
            max-width: 1200px;
            margin: auto;
            padding: 20px;
        }
        section {
            margin-bottom: 40px;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        /* Adicionado para remover a margem inferior do último bloco de notícias */
        .container > section:last-of-type {
            margin-bottom: 0;
        }
        h2 {
            margin-top: 0;
            font-size: 1.3em;
            border-bottom: 2px solid #ddd;
            padding-bottom: 10px;
            color: #222;
        }
		p.meta {
			color: #A5B1C2;
			margin: 0 0 16px 0;
		}
        /* Estilo para o rodapé */
        footer {
            text-align: center;
            padding: 20px; /* O espaçamento superior agora é controlado pela margem da seção acima */
            color: #A5B1C2; /* Mesma cor do texto "Desenvolvido por..." */
            font-size: 0.9em;
        }
        /* Adicionado para remover o espaço entre as linhas do rodapé */
        footer p {
            margin: 0;
        }
    </style>
</head>
<body>
    <header>
        <img src="gruponews.png" alt="Logo Grupo WE">
		   <p class="meta">Desenvolvido por Renato Poletto e Eduardo Akkari.</p>
    </header>
