<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DASHBOARD DE CAMPANHAS META ADS + GOOGLE ADS - GRUPO WE</title>
  <style>
    :root { --bg:#1f2937; --panel:#111827; --card:#0b1220; --muted:#9ca3af; --text:#e5e7eb; --accent:#a855f7; --accent-2:#8b5cf6; --danger:#ef4444; --warn:#f59e0b; --border:#374151; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, Noto Sans; }
    .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
    h1 { margin: 0 0 6px 0; font-size: 28px; font-weight: 800; }
    p.meta { color:var(--muted); margin:0 0 16px 0; }
    section { background: var(--panel); padding: 18px; border-radius: 14px; border: 1px solid var(--border); margin-top: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <img src="wemetrics.png" alt="logo area51 e grupowe" style="display: block; margin: 0 auto; width: 250px;"><br>
    <h1>DASHBOARD PARA CAMPANHAS DE META ADS + GOOGLE ADS</h1>
    <p class="meta">Desenvolvido por Eduardo Akkari e Renato Poletto.</p>

    <div id="exportRoot">
      <section id="initial">
        <img src="dash.png" alt="Dashboard" style="width: 100%; display: block;">
      </section>
    </div>

  </div>

</body>
</html>
