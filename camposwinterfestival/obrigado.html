<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campos Winter Festival - Cadastro Confirmado</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .page-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .banner-image {
            width: 100%;
        }

        .banner-image img {
            width: 100%;
            height: auto;
            display: block;
        }

        .divider {
            width: 100%;
            height: 15px;
        }

        .text-block {
            width: 100%;
            padding: 10px 30px;
            text-align: center;
            color: #ffffff;
            font-size: 18px;
            line-height: 1.5;
        }

        .text-block strong {
            font-weight: 700;
        }

        .whatsapp-block {
            width: 100%;
            padding: 10px 30px;
            text-align: center;
        }

        .whatsapp-block a img {
            width: 100px;
            height: 100px;
            display: inline-block;
        }

        .logo-block {
            width: 100%;
            padding: 15px 10px;
            text-align: center;
        }

        .logo-block img {
            width: 100px;
            height: auto;
        }

        .divider-bottom {
            width: 100%;
            height: 15px;
        }
    </style>
    <!-- Script de Redirecionamento Automático para o WhatsApp -->
    <script>
        setTimeout(function() {
            window.location.href = "https://chat.whatsapp.com/KqzsOqskn3dF2h75onEAuy";
        }, 3000); // 3000 milissegundos = 3 segundos
    </script>
</head>
<body>
    <div class="page-container">
        <!-- Logo Sistema Agitos -->
        <div class="logo-block">
            <img src="sistemaagitos.png" alt="Sistema Agitos">
        </div>

        <!-- Texto de confirmação -->
        <div class="text-block">
            <p>
                <strong>CADASTRO CONFIRMADO.</strong><br><br>
                <strong>A pré-venda acontece no dia 16 de abril, terça-feira às 11h</strong><br><br>
                Fique atento, você receberá o link para garantir seu ingresso antes de todo mundo.
            </p>
            <p style="margin-top: 15px;">
                Clique no botão abaixo para entrar no grupo de avisos no WhatsAPP e receber o link.
            </p>
        </div>

        <!-- Botão WhatsApp -->
        <div class="whatsapp-block">
            <a href="https://chat.whatsapp.com/KqzsOqskn3dF2h75onEAuy" target="_blank">
                <img src="https://d15k2d11r6t6rl.cloudfront.net/public/users/Integrators/7ba73aaa-3da9-4cf1-abf2-ccc85dea5875/bee-leadlovers-uid-4466229/whatsapp.png" alt="Entrar no grupo WhatsApp">
            </a>
        </div>

        <!-- Separador -->
        <div class="divider"></div>

        <div class="banner-image">
            <img src="base-01.png" alt="Campos Winter Festival 2026">
        </div>
        <div class="banner-image">
            <img src="base-02.png" alt="Campos Winter Festival 2026">
        </div>
        <div class="banner-image">
            <img src="base-03.png" alt="Campos Winter Festival 2026">
        </div>

        <!-- Separador final -->
        <div class="divider-bottom"></div>
    </div>
</body>
</html>
