<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Campos Winter Festival</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #0f1923;
            font-family: Arial, Helvetica, sans-serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ========== LOGIN ========== */
        .login-container {
            background-color: #1a2733;
            border-radius: 12px;
            padding: 50px 40px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        .login-container img {
            width: 120px;
            margin-bottom: 20px;
        }

        .login-container .subtitle {
            color: #8899aa;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .login-container label {
            display: block;
            text-align: left;
            font-size: 12px;
            font-weight: 700;
            color: #8899aa;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .login-container input {
            width: 100%;
            height: 48px;
            padding: 0 16px;
            font-size: 15px;
            color: #ffffff;
            background-color: #253340;
            border: 1px solid #334455;
            border-radius: 8px;
            outline: none;
            font-family: Arial, Helvetica, sans-serif;
            margin-bottom: 24px;
        }

        .login-container input::placeholder {
            color: #556677;
        }

        .login-container input:focus {
            border-color: #D35400;
        }

        .login-btn {
            width: 100%;
            height: 48px;
            background-color: #D35400;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: Arial, Helvetica, sans-serif;
        }

        .login-btn:hover {
            background-color: #B94700;
        }

        .login-erro {
            color: #ff4444;
            font-size: 13px;
            margin-top: 12px;
            display: none;
        }

        /* ========== DASHBOARD ========== */
        .dashboard {
            display: none;
            width: 100%;
            min-height: 100vh;
            padding: 24px;
        }

        .dash-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .dash-header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .dash-header-left img {
            width: 80px;
            height: auto;
        }

        .dash-header h1 {
            font-size: 22px;
            font-weight: 700;
        }

        .dash-header-right {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .download-btn {
            background-color: #D35400;
            border: none;
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            font-family: Arial, Helvetica, sans-serif;
        }

        .download-btn:hover {
            background-color: #B94700;
        }

        .dash-header .logout-btn {
            background: none;
            border: 1px solid #334455;
            color: #8899aa;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-family: Arial, Helvetica, sans-serif;
        }

        .dash-header .logout-btn:hover {
            border-color: #D35400;
            color: #D35400;
        }

        .cards {
            display: flex;
            gap: 20px;
            margin-bottom: 24px;
        }

        .card {
            background-color: #1a2733;
            border-radius: 12px;
            padding: 24px 30px;
            flex: 1;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
        }

        .card .card-label {
            font-size: 13px;
            color: #8899aa;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .card .card-value {
            font-size: 42px;
            font-weight: 700;
            color: #D35400;
        }

        /* ========== CALENDÁRIO ========== */
        .calendar-container {
            background-color: #1a2733;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
        }

        .cal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .cal-header h2 {
            font-size: 18px;
            font-weight: 700;
        }

        .cal-nav {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .cal-nav button {
            background: none;
            border: 1px solid #334455;
            color: #8899aa;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-family: Arial, Helvetica, sans-serif;
        }

        .cal-nav button:hover {
            border-color: #D35400;
            color: #D35400;
        }

        .cal-nav .cal-today {
            background-color: #D35400;
            border-color: #D35400;
            color: #ffffff;
        }

        .cal-nav .cal-today:hover {
            background-color: #B94700;
        }

        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .cal-dow {
            text-align: center;
            font-size: 11px;
            font-weight: 700;
            color: #556677;
            text-transform: uppercase;
            padding: 8px 0;
        }

        .cal-day {
            background-color: #253340;
            border-radius: 8px;
            min-height: 80px;
            padding: 8px;
            position: relative;
        }

        .cal-day.empty {
            background-color: transparent;
        }

        .cal-day .day-num {
            font-size: 13px;
            color: #8899aa;
        }

        .cal-day.today {
            border: 2px solid #D35400;
        }

        .cal-day.today .day-num {
            color: #D35400;
            font-weight: 700;
        }

        .cal-day .day-count {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background-color: #D35400;
            color: #ffffff;
            font-size: 12px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 10px;
            min-width: 24px;
            text-align: center;
        }

        /* ========== PAINÉIS GÊNERO E CIDADES ========== */
        .stats-row {
            display: flex;
            gap: 20px;
            margin-bottom: 24px;
        }

        .stats-panel {
            background-color: #1a2733;
            border-radius: 12px;
            padding: 24px;
            flex: 1;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
            border: 1px solid #253340;
        }

        .stats-panel h3 {
            font-size: 13px;
            color: #8899aa;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }

        .genero-item { margin-bottom: 14px; }

        .genero-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .genero-label { font-size: 14px; color: #ffffff; }

        .genero-numbers { font-size: 14px; color: #8899aa; }
        .genero-numbers strong { color: #ffffff; margin-right: 6px; }

        .genero-bar {
            height: 8px;
            border-radius: 4px;
            background-color: #253340;
            overflow: hidden;
        }

        .genero-bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.6s ease;
        }

        .genero-bar-fill.masculino { background-color: #E8956A; }
        .genero-bar-fill.feminino { background-color: #E866A0; }
        .genero-bar-fill.desconhecido { background-color: #5B8CCC; }

        .genero-footnote {
            font-size: 11px;
            color: #556677;
            margin-top: 16px;
        }

        .cidade-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            gap: 12px;
        }

        .cidade-nome {
            font-size: 14px;
            color: #ffffff;
            min-width: 150px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .cidade-bar-wrap {
            flex: 1;
            height: 8px;
            background-color: #253340;
            border-radius: 4px;
            overflow: hidden;
        }

        .cidade-bar-fill {
            height: 100%;
            border-radius: 4px;
            background-color: #5BB8A6;
            transition: width 0.6s ease;
        }

        .cidade-count {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            min-width: 30px;
            text-align: right;
        }

        @media (max-width: 700px) {
            .cards { flex-direction: column; }
            .stats-row { flex-direction: column; }
            .cal-day { min-height: 60px; }
            .dashboard { padding: 12px; }
        }
    </style>
</head>
<body>

    <!-- ========== TELA DE LOGIN ========== -->
    <div class="login-container" id="loginScreen">
        <img src="sistemaagitos.png" alt="Sistema Agitos">
        <p class="subtitle">Digite a senha para acesso:</p>

        <label>SENHA</label>
        <input type="password" id="senhaInput" placeholder="••••••••" autofocus>

        <button class="login-btn" id="loginBtn">Entrar</button>
        <p class="login-erro" id="loginErro">Senha incorreta. Tente novamente.</p>
    </div>

    <!-- ========== DASHBOARD ========== -->
    <div class="dashboard" id="dashScreen">
        <div class="dash-header">
            <div class="dash-header-left">
                <img src="sistemaagitos.png" alt="Sistema Agitos">
                <h1>Painel de Cadastros - Campos Winter Festival 2026</h1>
            </div>
            <div class="dash-header-right">
                <button class="download-btn" id="downloadBtn">BAIXAR CADASTROS</button>
                <button class="logout-btn" id="logoutBtn">Sair</button>
            </div>
        </div>

        <div class="cards">
            <div class="card">
                <div class="card-label">Total de Cadastros</div>
                <div class="card-value" id="totalCadastros">—</div>
            </div>
            <div class="card">
                <div class="card-label">Cadastros Hoje</div>
                <div class="card-value" id="cadastrosHoje">—</div>
            </div>
        </div>

        <div class="stats-row">
            <div class="stats-panel">
                <h3>Por Gênero</h3>
                <div id="generoContent"></div>
                <div class="genero-footnote">Inferido a partir do primeiro nome (heurística BR)</div>
            </div>
            <div class="stats-panel">
                <h3>Top Cidades</h3>
                <div id="cidadesContent"></div>
            </div>
            <div class="stats-panel">
                <h3>Top Estados</h3>
                <div id="estadosContent"></div>
            </div>
        </div>

        <div class="calendar-container">
            <div class="cal-header">
                <h2 id="calTitle"></h2>
                <div class="cal-nav">
                    <button id="calPrev">&#8249; Anterior</button>
                    <button id="calToday" class="cal-today">Hoje</button>
                    <button id="calNext">Próximo &#8250;</button>
                </div>
            </div>
            <div class="cal-grid" id="calGrid"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://sexwqzahwxgjkbcjlgxm.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNleHdxemFod3hnamtiY2psZ3htIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxNTY2MDUsImV4cCI6MjA5MDczMjYwNX0.4rL55mqa_wsWoVdTZWLkUAvpkiSlj7E5ZcxQvnoIz8w';
        const SENHA_ADMIN = 'Agitos2026!';

        const meses = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
        const diasSemana = ['DOM','SEG','TER','QUA','QUI','SEX','SÁB'];

        let currentMonth, currentYear;
        let cadastrosData = [];

        // ========== LOGIN ==========
        document.getElementById('loginBtn').addEventListener('click', tentarLogin);
        document.getElementById('senhaInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') tentarLogin();
        });

        function mostrarDashboard() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('dashScreen').style.display = 'block';
            document.body.style.alignItems = 'flex-start';
            carregarDados();
        }

        function tentarLogin() {
            const senha = document.getElementById('senhaInput').value;
            if (senha === SENHA_ADMIN) {
                sessionStorage.setItem('cwf_admin_logado', 'true');
                mostrarDashboard();
            } else {
                document.getElementById('loginErro').style.display = 'block';
                document.getElementById('senhaInput').value = '';
                document.getElementById('senhaInput').focus();
            }
        }

        // Restaurar sessão ao recarregar a página
        if (sessionStorage.getItem('cwf_admin_logado') === 'true') {
            mostrarDashboard();
        }

        document.getElementById('logoutBtn').addEventListener('click', function() {
            sessionStorage.removeItem('cwf_admin_logado');
            document.getElementById('dashScreen').style.display = 'none';
            document.getElementById('loginScreen').style.display = 'block';
            document.body.style.alignItems = 'center';
            document.getElementById('senhaInput').value = '';
            document.getElementById('loginErro').style.display = 'none';
        });

        // ========== CARREGAR DADOS ==========
        async function carregarDados() {
            try {
                const response = await fetch(SUPABASE_URL + '/rest/v1/cadastros?select=id,criado_em,nome,cidade,estado&order=criado_em.asc', {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': 'Bearer ' + SUPABASE_KEY
                    }
                });

                if (!response.ok) throw new Error('Erro ao carregar dados');

                cadastrosData = await response.json();
                atualizarCards();
                renderGenero();
                renderCidades();
                renderEstados();

                const hoje = new Date();
                currentMonth = hoje.getMonth();
                currentYear = hoje.getFullYear();
                renderCalendario();

            } catch (error) {
                console.error('Erro:', error);
                document.getElementById('totalCadastros').textContent = 'Erro';
                document.getElementById('cadastrosHoje').textContent = 'Erro';
            }
        }

        // ========== UTILS - FUSO HORÁRIO ==========
        function dataLocalBR(dateStr) {
            const d = new Date(dateStr);
            const ano = d.toLocaleString('sv-SE', { timeZone: 'America/Sao_Paulo', year: 'numeric' });
            const mes = d.toLocaleString('sv-SE', { timeZone: 'America/Sao_Paulo', month: '2-digit' });
            const dia = d.toLocaleString('sv-SE', { timeZone: 'America/Sao_Paulo', day: '2-digit' });
            return ano + '-' + mes + '-' + dia;
        }

        function hojeBR() {
            return dataLocalBR(new Date().toISOString());
        }

        // ========== CARDS ==========
        function atualizarCards() {
            document.getElementById('totalCadastros').textContent = cadastrosData.length;

            const hoje = hojeBR();
            const hojeCount = cadastrosData.filter(c => c.criado_em && dataLocalBR(c.criado_em) === hoje).length;
            document.getElementById('cadastrosHoje').textContent = hojeCount;
        }

        // ========== GÊNERO (heurística BR) ==========
        function inferirGenero(nome) {
            if (!nome || !nome.trim()) return 'Desconhecido';
            const primeiro = nome.trim().split(/\s+/)[0].toLowerCase()
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '');

            const mascEmA = ['luca','josua','nicola','batista','noa','esdra'];
            const femSemA = [
                'alice','beatriz','raquel','suelen','jaqueline','michele','carmen',
                'miriam','liz','iris','ines','mabel','abigail','ingrid','nair',
                'rute','jade','gisele','viviane','simone','elaine','diane',
                'monique','denise','berenice','clarice','aline','cristiane',
                'fabiane','luciane','rosane','solange','marilene','marlene',
                'noemi','raquelle','sueli','arieli','nicole','maryane','nathalie'
            ];

            if (mascEmA.includes(primeiro)) return 'Masculino';
            if (femSemA.includes(primeiro)) return 'Feminino';

            const last = primeiro.slice(-1);
            if (last === 'a') return 'Feminino';
            if (last === 'o') return 'Masculino';

            return 'Desconhecido';
        }

        function renderGenero() {
            const contagem = { Masculino: 0, Feminino: 0, Desconhecido: 0 };
            cadastrosData.forEach(c => {
                const g = inferirGenero(c.nome);
                contagem[g]++;
            });

            const total = cadastrosData.length || 1;
            const container = document.getElementById('generoContent');
            container.innerHTML = '';

            const itens = [
                { label: 'Masculino', classe: 'masculino' },
                { label: 'Feminino', classe: 'feminino' },
                { label: 'Desconhecido', classe: 'desconhecido' }
            ];

            itens.forEach(item => {
                const count = contagem[item.label];
                const pct = Math.round((count / total) * 100);
                const div = document.createElement('div');
                div.className = 'genero-item';
                div.innerHTML =
                    '<div class="genero-info">' +
                        '<span class="genero-label">' + item.label + '</span>' +
                        '<span class="genero-numbers"><strong>' + count + '</strong>' + pct + '%</span>' +
                    '</div>' +
                    '<div class="genero-bar">' +
                        '<div class="genero-bar-fill ' + item.classe + '" style="width:' + pct + '%"></div>' +
                    '</div>';
                container.appendChild(div);
            });
        }

        // ========== TOP CIDADES ==========
        function renderCidades() {
            const contagem = {};
            cadastrosData.forEach(c => {
                if (c.cidade && c.cidade.trim()) {
                    const cidade = c.cidade.trim();
                    contagem[cidade] = (contagem[cidade] || 0) + 1;
                }
            });

            const ordenadas = Object.entries(contagem)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 10);

            const container = document.getElementById('cidadesContent');
            container.innerHTML = '';

            if (!ordenadas.length) {
                container.innerHTML = '<span style="color:#556677;font-size:13px;">Nenhum dado</span>';
                return;
            }

            const max = ordenadas[0][1];

            ordenadas.forEach(([cidade, count]) => {
                const pct = Math.round((count / max) * 100);
                const div = document.createElement('div');
                div.className = 'cidade-item';
                div.innerHTML =
                    '<span class="cidade-nome">' + cidade + '</span>' +
                    '<div class="cidade-bar-wrap">' +
                        '<div class="cidade-bar-fill" style="width:' + pct + '%"></div>' +
                    '</div>' +
                    '<span class="cidade-count">' + count + '</span>';
                container.appendChild(div);
            });
        }

        // ========== TOP ESTADOS ==========
        function renderEstados() {
            const contagem = {};
            cadastrosData.forEach(c => {
                if (c.estado && c.estado.trim()) {
                    const estado = c.estado.trim();
                    contagem[estado] = (contagem[estado] || 0) + 1;
                }
            });

            const ordenadas = Object.entries(contagem)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 10);

            const container = document.getElementById('estadosContent');
            container.innerHTML = '';

            if (!ordenadas.length) {
                container.innerHTML = '<span style="color:#556677;font-size:13px;">Nenhum dado</span>';
                return;
            }

            const max = ordenadas[0][1];

            ordenadas.forEach(([estado, count]) => {
                const pct = Math.round((count / max) * 100);
                const div = document.createElement('div');
                div.className = 'cidade-item';
                div.innerHTML =
                    '<span class="cidade-nome">' + estado + '</span>' +
                    '<div class="cidade-bar-wrap">' +
                        '<div class="cidade-bar-fill" style="width:' + pct + '%"></div>' +
                    '</div>' +
                    '<span class="cidade-count">' + count + '</span>';
                container.appendChild(div);
            });
        }

        // ========== CALENDÁRIO ==========
        function contarPorDia() {
            const contagem = {};
            cadastrosData.forEach(c => {
                if (c.criado_em) {
                    const dia = dataLocalBR(c.criado_em);
                    contagem[dia] = (contagem[dia] || 0) + 1;
                }
            });
            return contagem;
        }

        function renderCalendario() {
            document.getElementById('calTitle').textContent = meses[currentMonth] + ' ' + currentYear;

            const grid = document.getElementById('calGrid');
            grid.innerHTML = '';

            // Cabeçalho dias da semana
            diasSemana.forEach(d => {
                const el = document.createElement('div');
                el.className = 'cal-dow';
                el.textContent = d;
                grid.appendChild(el);
            });

            const primeiroDia = new Date(currentYear, currentMonth, 1).getDay();
            const diasNoMes = new Date(currentYear, currentMonth + 1, 0).getDate();
            const hoje = new Date();
            const contagem = contarPorDia();

            // Dias vazios antes do mês
            for (let i = 0; i < primeiroDia; i++) {
                const el = document.createElement('div');
                el.className = 'cal-day empty';
                grid.appendChild(el);
            }

            // Dias do mês
            for (let dia = 1; dia <= diasNoMes; dia++) {
                const el = document.createElement('div');
                el.className = 'cal-day';

                const isToday = dia === hoje.getDate() && currentMonth === hoje.getMonth() && currentYear === hoje.getFullYear();
                if (isToday) el.classList.add('today');

                const numEl = document.createElement('div');
                numEl.className = 'day-num';
                numEl.textContent = dia;
                el.appendChild(numEl);

                const dateStr = currentYear + '-' + String(currentMonth + 1).padStart(2, '0') + '-' + String(dia).padStart(2, '0');
                const count = contagem[dateStr];
                if (count) {
                    const countEl = document.createElement('div');
                    countEl.className = 'day-count';
                    countEl.textContent = count;
                    el.appendChild(countEl);
                }

                grid.appendChild(el);
            }
        }

        // Navegação do calendário
        document.getElementById('calPrev').addEventListener('click', function() {
            currentMonth--;
            if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            renderCalendario();
        });

        document.getElementById('calNext').addEventListener('click', function() {
            currentMonth++;
            if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            renderCalendario();
        });

        document.getElementById('calToday').addEventListener('click', function() {
            const hoje = new Date();
            currentMonth = hoje.getMonth();
            currentYear = hoje.getFullYear();
            renderCalendario();
        });

        // ========== BAIXAR CADASTROS (CSV) ==========
        document.getElementById('downloadBtn').addEventListener('click', async function() {
            const btn = this;
            btn.disabled = true;
            btn.textContent = 'BAIXANDO...';

            try {
                const response = await fetch(SUPABASE_URL + '/rest/v1/cadastros?select=*&order=criado_em.desc', {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': 'Bearer ' + SUPABASE_KEY
                    }
                });

                if (!response.ok) throw new Error('Erro ao baixar dados');

                const dados = await response.json();
                if (!dados.length) {
                    alert('Nenhum cadastro encontrado.');
                    return;
                }

                const colunas = Object.keys(dados[0]);
                const linhas = [colunas.join(';')];

                dados.forEach(row => {
                    const valores = colunas.map(col => {
                        let val = row[col] == null ? '' : String(row[col]);
                        val = val.replace(/"/g, '""');
                        return '"' + val + '"';
                    });
                    linhas.push(valores.join(';'));
                });

                const csv = '\uFEFF' + linhas.join('\r\n');
                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'cadastros_campos_winter_festival.csv';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

            } catch (error) {
                console.error('Erro:', error);
                alert('Erro ao baixar cadastros. Tente novamente.');
            } finally {
                btn.disabled = false;
                btn.textContent = 'BAIXAR CADASTROS';
            }
        });
    </script>
</body>
</html>
