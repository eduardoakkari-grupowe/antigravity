<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campos Winter Festival - Cadastro Pré-Venda</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .page-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .banner-image {
            width: 100%;
        }

        .banner-image img {
            width: 100%;
            height: auto;
            display: block;
        }

        .divider {
            width: 100%;
            height: 15px;
        }

        .text-block {
            width: 100%;
            padding: 10px 10px 5px 10px;
            text-align: center;
        }

        .text-block p {
            color: #ffffff;
            font-size: 14px;
            line-height: 1.5;
        }

        .form-block {
            width: 100%;
            padding: 0 10px 10px 10px;
        }

        .form-block form {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .form-group {
            margin-bottom: 6px;
        }

        .form-group label {
            display: block;
            color: #ffffff;
            font-size: 14px;
            margin-bottom: 2px;
        }

        .form-group input {
            width: 100%;
            height: 38px;
            padding: 8px 12px;
            font-size: 14px;
            color: #000000;
            background-color: #ffffff;
            border: 1px solid transparent;
            border-radius: 4px;
            outline: none;
            font-family: Arial, Helvetica, sans-serif;
        }

        .form-group input::placeholder {
            color: #999999;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #D35400;
        }

        .form-group select {
            width: 100%;
            height: 38px;
            padding: 8px 12px;
            font-size: 14px;
            color: #000000;
            background-color: #ffffff;
            border: 1px solid transparent;
            border-radius: 4px;
            outline: none;
            font-family: Arial, Helvetica, sans-serif;
            appearance: auto;
        }

        .form-group select:disabled {
            background-color: #e0e0e0;
            color: #999999;
        }

        .submit-btn {
            width: 100%;
            height: 38px;
            background-color: #D35400;
            color: #ffffff;
            font-size: 14px;
            font-family: Arial, Helvetica, sans-serif;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 6px;
            font-weight: 400;
        }

        .submit-btn:hover {
            background-color: #B94700;
        }

        .submit-btn:disabled {
            background-color: #999999;
            cursor: not-allowed;
        }

        .logo-block {
            width: 100%;
            padding: 15px 10px;
            text-align: center;
        }

        .logo-block img {
            width: 100px;
            height: auto;
        }

        .divider-bottom {
            width: 100%;
            height: 15px;
        }

        .msg-erro {
            color: #ff4444;
            font-size: 13px;
            text-align: center;
            margin-top: 8px;
            display: none;
        }
    </style>
	<!-- Meta Pixel Code -->

    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?

    <noscript>
    <img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=828874142955210&ev=PageView&noscript=1"/>
    </noscript>

</head>
<body>
    <div class="page-container">
        <div class="banner-image">
            <img src="camposwinterfestival2.png" alt="Campos Winter Festival 2026">
        </div>

        <!-- Separador -->
        <div class="divider"></div>

        <!-- Título do formulário -->
        <div class="text-block">
            <p><strong>FAÇA O SEU CADASTRO PARA A PRÉ VENDA</strong></p>
        </div>

        <!-- Formulário de cadastro -->
        <div class="form-block">
            <form id="cadastroForm">
                <div class="form-group">
                    <label>Nome</label>
                    <input type="text" id="nome" placeholder="Seu nome" required>
                </div>
                <div class="form-group">
                    <label>E-mail</label>
                    <input type="email" id="email" placeholder="Seu e-mail" required>
                </div>
                <div class="form-group">
                    <label>Telefone</label>
                    <div style="display:flex; align-items:center; gap:0;">
                        <span style="background:#ffffff; color:#000; font-size:14px; padding:8px 8px 8px 12px; height:38px; display:flex; align-items:center; border-radius:4px 0 0 4px; white-space:nowrap;">+55</span>
                        <input type="tel" id="telefone" placeholder="(11) 98108-2020" style="border-radius:0 4px 4px 0;" maxlength="15">
                    </div>
                </div>
                <div class="form-group">
                    <label>Estado</label>
                    <select id="estado" required>
                        <option value="">Selecione o estado</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Cidade</label>
                    <select id="cidade" required disabled>
                        <option value="">Selecione o estado primeiro</option>
                    </select>
                </div>
                <button type="submit" class="submit-btn" id="submitBtn">FAZER CADASTRO</button>
                <p class="msg-erro" id="msgErro"></p>
            </form>
        </div>

        <!-- Logo Sistema Agitos -->
        <div class="logo-block">
            <img src="sistemaagitos.png" alt="Sistema Agitos">
        </div>

        <!-- Separador final -->
        <div class="divider-bottom"></div>
    </div>

    <script src="env.js"></script>
    <script>
        const SUPABASE_URL = ENV.SUPABASE_URL;
        const SUPABASE_KEY = ENV.SUPABASE_KEY;

        // ========== ESTADOS E CIDADES (IBGE) ==========
        const estadoSelect = document.getElementById('estado');
        const cidadeSelect = document.getElementById('cidade');

        // Carregar estados
        fetch('https://servicodados.ibge.gov.br/api/v1/localidades/estados?orderBy=nome')
            .then(r => r.json())
            .then(estados => {
                estados.forEach(uf => {
                    const opt = document.createElement('option');
                    opt.value = uf.sigla;
                    opt.textContent = uf.nome;
                    estadoSelect.appendChild(opt);
                });
            });

        // Ao selecionar estado, carregar cidades
        estadoSelect.addEventListener('change', function() {
            cidadeSelect.innerHTML = '';

            if (!this.value) {
                cidadeSelect.disabled = true;
                cidadeSelect.innerHTML = '<option value="">Selecione o estado primeiro</option>';
                return;
            }

            cidadeSelect.disabled = true;
            cidadeSelect.innerHTML = '<option value="">Carregando...</option>';

            fetch('https://servicodados.ibge.gov.br/api/v1/localidades/estados/' + this.value + '/municipios?orderBy=nome')
                .then(r => r.json())
                .then(cidades => {
                    cidadeSelect.innerHTML = '<option value="">Selecione a cidade</option>';
                    cidades.forEach(c => {
                        const opt = document.createElement('option');
                        opt.value = c.nome;
                        opt.textContent = c.nome;
                        cidadeSelect.appendChild(opt);
                    });
                    cidadeSelect.disabled = false;
                });
        });

        // Máscara de telefone: (XX) XXXXX-XXXX
        document.getElementById('telefone').addEventListener('input', function(e) {
            let v = e.target.value.replace(/\D/g, '');
            if (v.length > 11) v = v.substring(0, 11);
            if (v.length > 6) {
                v = '(' + v.substring(0,2) + ') ' + v.substring(2,7) + '-' + v.substring(7);
            } else if (v.length > 2) {
                v = '(' + v.substring(0,2) + ') ' + v.substring(2);
            } else if (v.length > 0) {
                v = '(' + v;
            }
            e.target.value = v;
        });

        document.getElementById('cadastroForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const btn = document.getElementById('submitBtn');
            const msgErro = document.getElementById('msgErro');

            btn.disabled = true;
            btn.textContent = 'AGUARDE...';
            msgErro.style.display = 'none';

            const estadoEl = document.getElementById('estado');
            const dados = {
                nome: document.getElementById('nome').value.trim(),
                email: document.getElementById('email').value.trim(),
                telefone: '+55 ' + document.getElementById('telefone').value.trim(),
                cidade: document.getElementById('cidade').value,
                estado: estadoEl.options[estadoEl.selectedIndex].text
            };

            try {
                const response = await fetch(SUPABASE_URL + '/rest/v1/cadastros', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': SUPABASE_KEY,
                        'Authorization': 'Bearer ' + SUPABASE_KEY,
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify(dados)
                });

                if (response.ok) {
                    window.location.href = 'obrigado.html';
                } else {
                    const erro = await response.json();
                    throw new Error(erro.message || 'Erro ao salvar cadastro');
                }
            } catch (error) {
                msgErro.textContent = 'Erro ao enviar cadastro. Tente novamente.';
                msgErro.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'FAZER CADASTRO';
            }
        });
    </script>
</body>
</html>
