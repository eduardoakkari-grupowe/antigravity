<!-- ===== LOGIN PADRÃO GrupoWE — colar logo após <body> ===== -->
<style id="gwe-gate-style">
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  #gwe-gate{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;
    justify-content:center;background:#ffffff;font-family:'Inter',system-ui,sans-serif;}
  #gwe-gate .gwe-box{background:#f0f0f0;border-radius:20px;padding:48px 36px;width:380px;
    max-width:calc(100vw - 40px);box-sizing:border-box;display:flex;flex-direction:column;
    align-items:center;gap:22px;box-shadow:0 4px 24px rgba(0,0,0,.08);}
  #gwe-gate .gwe-logo{width:160px;height:auto;filter:brightness(0);}
  #gwe-gate p{font-size:14px;color:#444;font-weight:500;margin:0;text-align:center;}
  #gwe-gate input{width:100%;box-sizing:border-box;padding:14px 16px;border:1.5px solid #ddd;
    border-radius:12px;background:#fff;font-size:14px;outline:none;transition:border .2s;
    color:#333;font-family:inherit;}
  #gwe-gate input:focus{border-color:#999;}
  #gwe-gate button{width:100%;padding:14px;background:#666;color:#fff;border:none;border-radius:12px;
    font-size:14px;font-weight:600;cursor:pointer;letter-spacing:.02em;transition:background .2s;
    font-family:inherit;}
  #gwe-gate button:hover{background:#444;}
  #gwe-gate button:disabled{opacity:.7;cursor:default;}
  #gwe-gate .gwe-err{color:#e53e3e;font-size:12px;min-height:14px;display:none;text-align:center;}
</style>

<script>
(function(){
  var SUPABASE_URL = "https://gmmcfiajdtljdcpigrst.supabase.co";
  var SUPABASE_ANON_KEY = "sb_publishable_aQ7ztI_2ZdS0QAjnm546Lw_uXHAKAZa";
  var STORAGE_KEY = "gwe_projeto_auth_ok";

  function normalizeUrl(u){
    return String(u).toLowerCase()
      .replace(/^https?:\/\//,'').replace(/^www\./,'')
      .split('#')[0].split('?')[0].replace(/\/+$/,'');
  }
  var urlKey = normalizeUrl(location.href);
  var gate = document.getElementById('gwe-gate');

  function liberar(){
    try{ sessionStorage.setItem(STORAGE_KEY, urlKey); }catch(e){}
    if(gate && gate.parentNode){ gate.parentNode.removeChild(gate); }
    document.documentElement.style.overflow = '';
    document.body.style.overflow = '';
  }

  // Já liberado nesta sessão?
  try{ if(sessionStorage.getItem(STORAGE_KEY) === urlKey){ liberar(); return; } }catch(e){}

  // Trava o scroll do conteúdo atrás do overlay (html e body).
  document.documentElement.style.overflow = 'hidden';
  document.body.style.overflow = 'hidden';

  var form = document.getElementById('gwe-form');
  var pass = document.getElementById('gwe-pass');
  var err  = document.getElementById('gwe-err');
  var btn  = document.getElementById('gwe-submit');
  var errTimer;

  function mostrarErro(msg){
    err.textContent = msg;
    err.style.display = 'block';
    clearTimeout(errTimer);
    errTimer = setTimeout(function(){ err.style.display = 'none'; }, 3000);
  }

  form.addEventListener('submit', function(ev){
    ev.preventDefault();
    err.style.display = 'none';
    btn.disabled = true; btn.textContent = 'Verificando...';
    fetch(SUPABASE_URL + "/rest/v1/rpc/projeto_verificar_senha", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": "Bearer " + SUPABASE_ANON_KEY
      },
      body: JSON.stringify({ p_url: location.href, p_senha: pass.value })
    })
    .then(function(r){ if(!r.ok){ throw new Error('http ' + r.status); } return r.json(); })
    .then(function(ok){
      if(ok === true){ liberar(); }
      else { pass.value = ''; mostrarErro('Senha incorreta. Tente novamente.'); }
    })
    .catch(function(){ mostrarErro('Erro de conexão. Tente de novo.'); })
    .finally(function(){ btn.disabled = false; btn.textContent = 'Entrar'; });
  });

  pass.focus();
})();
</script>
