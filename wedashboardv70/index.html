<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Awareness Dashboard</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="src/style.css">
</head>
<body>

<div id="tip">
  <div class="tw" id="tip-w"></div>
  <div class="tr"><span class="trl"><span class="trd" style="background:#6E5FD9"></span><span data-i18n="legend_imp">Impressões</span></span><span class="trv" id="tip-i"></span></div>
  <div class="tr"><span class="trl"><span class="trd" style="background:#22D4C8"></span><span data-i18n="legend_alc">Investimento</span></span><span class="trv" id="tip-a"></span></div>
</div>

<header class="hdr">
  <div class="hdr-l">
    <div class="logo" id="hdr-logo"></div>
    <span class="brand" id="hdr-brand"></span>
  </div>
  <div class="hdr-r">
    <span class="partial-tag" id="partial-tag" data-i18n="partial_tag">⬡ Período parcial</span>
  </div>
</header>

<nav class="nav">
  <div class="tabs" id="tabs"></div>

  <div style="display:flex;align-items:center;gap:10px">
    <div class="dr-wrap">
      <div class="dr-group">
        <span class="dr-lbl" data-i18n="dr_from">De</span>
        <input type="date" id="dr-start" class="dr-input">
      </div>
      <div class="dr-sep">—</div>
      <div class="dr-group">
        <span class="dr-lbl" data-i18n="dr_to">Até</span>
        <input type="date" id="dr-end" class="dr-input">
      </div>
    </div>
    <div class="lang-wrap" id="lang-wrap">
      <button class="lang-btn" id="lang-btn">
        <span id="lang-current">PT</span>
        <span class="lang-arr">▾</span>
      </button>
      <div class="lang-drop" id="lang-drop">
        <div class="lang-opt active" data-lang="pt">PT-BR</div>
        <div class="lang-opt" data-lang="en">EN</div>
        <div class="lang-opt" data-lang="cn">中文</div>
      </div>
    </div>
  </div>
</nav>

<main>

<!-- VISÃO GERAL -->
<div class="tc active" id="tab-visao">
  <div class="ch-filter" id="ch-filter"></div>
  <div class="sec-title" data-i18n="sec_kpis">Big Numbers</div>
  <div class="kpi-grid" id="kpi-grid"></div>
  <div class="sec-title" data-i18n="sec_ach">Progresso</div>
  <div class="kpi-ach" id="kpi-ach"></div>
  <div class="sec-title" data-i18n="title_daily">Entrega Diária</div>
  <div class="cc" style="margin-bottom:12px">
    <div class="cc-hdr">
      <div class="cc-sub" id="tl-sub" data-i18n="sub_daily">Impressões por dia (barras) · Investimento diário (linha)</div>
      <div class="legend">
        <div class="li"><div class="ld" style="background:#6E5FD9"></div><span data-i18n="legend_imp">Impressões</span></div>
        <div class="li"><div class="ll" style="background:#22D4C8"></div><span data-i18n="legend_alc">Investimento</span></div>
      </div>
    </div>
    <div class="cw">
      <canvas id="c-timeline"></canvas>
      <div class="empty-state" id="tl-empty">
        <div class="empty-icon">◈</div>
        <div class="empty-txt" data-i18n="empty_txt">Nenhum dado no período selecionado</div>
      </div>
    </div>
  </div>
  <div class="sec-title" data-i18n="sec_channels">Desempenho por Canal</div>
  <div class="bot">
    <div class="cc" style="overflow:hidden">
      <div id="ch-table-card"></div>
    </div>
  </div>
</div>



<!-- SOURCE PAGES (dynamically populated per plan source) -->
<div class="tc" id="tab-source"><div id="src-content"></div></div>

<!-- CRIATIVOS -->
<div class="tc" id="tab-criativos">
  <div id="cr-content"></div>
</div>

</main>

<script src="src/translations.js"></script>
<script src="src/supabase.js"></script>
<script src="src/data.js"></script>
<script src="src/charts.js"></script>
<script src="src/ui.js"></script>
<script src="src/main.js"></script>
</body>
</html>
